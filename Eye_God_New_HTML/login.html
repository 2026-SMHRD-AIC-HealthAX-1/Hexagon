<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eye God - 로그인</title><style>*{box-sizing:border-box}body{margin:0;font-family:Pretendard,"Noto Sans KR",Arial,sans-serif;color:#252b33;background:#fff}button,input{font:inherit}button{cursor:pointer}a{text-decoration:none;color:inherit}.page{min-height:100vh;display:flex;flex-direction:column}header{height:76px;border-bottom:1px solid #eee;display:flex;align-items:center}.head{width:900px;max-width:calc(100% - 48px);margin:auto;display:flex;justify-content:space-between;align-items:center}.logo{display:flex;gap:10px;align-items:center;font-size:24px;font-weight:700;color:#5f9fe9}.eye{width:32px;height:20px;border-radius:50%;background:#9fc8f5;position:relative}.eye:after{content:"";position:absolute;width:9px;height:9px;border-radius:50%;background:white;left:12px;top:5px}.right{display:flex;gap:26px;align-items:center}.nav{font-size:14px;color:#59636f}.primary,.logout{border:0;background:#8ebaf0;color:white;padding:11px 20px;border-radius:12px;font-weight:600}main{flex:1;padding:42px 0 60px}.container{width:900px;max-width:calc(100% - 48px);margin:auto}.title{margin:0 0 8px;font-size:28px}.desc{margin:0 0 30px;color:#737d88;font-size:14px;line-height:1.7}.section{margin-bottom:40px}.st{font-size:20px;margin:0 0 15px}.panel{border:1px solid #e1e7ed;border-radius:18px;padding:24px}.blue{background:#f4f8fd;border:1px solid #dce9f8;border-radius:18px;padding:24px}.notice{font-size:11px;color:#9aa1aa;line-height:1.6}footer{border-top:1px solid #eee;padding:18px;text-align:center;color:#9aa1aa;font-size:12px;line-height:1.6}@media(max-width:700px){.head,.container{max-width:calc(100% - 32px)}.nav{display:none}}</style></head><body><div class="page"><main><div style="min-height:70vh;display:flex;align-items:center;justify-content:center"><div style="width:410px;text-align:center"><div class="logo" style="justify-content:center;margin-bottom:35px"><span class="eye"></span>Eye God</div><h1 class="title">로그인</h1><p class="desc">Eye God의 눈 건강 관리 서비스를 이용하려면<br>로그인이 필요해요.</p><button class="social" onclick="login()">G Google로 계속하기</button><button class="social kakao" onclick="login()">● 카카오로 계속하기</button><p class="notice">로그인하면 검사 결과와 눈 운동 기록을 저장하고<br>마이페이지에서 건강 추이를 확인할 수 있어요.</p></div></div><style>.social{width:100%;border:0;border-radius:12px;padding:15px;margin:5px 0;font-weight:600}.kakao{background:#fee500;color:#3b3200}.social:first-of-type{background:#f3f5f7;color:#30363d}</style></main><footer>본 서비스는 정식 의료 서비스가 아니며 참고용이므로 정확한 진단은 전문의 또는 병원을 방문하시기 바랍니다.</footer></div><script>function login(){
  try { localStorage.setItem("eyeGodLoggedIn","true"); } catch(e) {}
  try { sessionStorage.setItem("isLoggedIn","true"); } catch(e) {}
  location.href="index.html?auth=1";
}</script></body></html>
