<!--
  테스트용 미니게임 (리듬 게임).

  시선/깜빡임 계산과 노트 판정을 전부 브라우저에서 수행한다 - 카메라 영상은
  서버로 전송되지 않고, 게임이 끝났을 때 최종 점수만 POST 한다.
  (예전에는 서버 파이썬 MediaPipe 가 계산했다. 그 버전은 rhythm_game_lab.html
   에 백업으로 남아있다 - 문제가 생기면 그쪽으로 되돌릴 수 있다.)

  실행 전 준비 (한 번만, 프로젝트 루트에서):
      python scripts/setup_mediapipe.py
  브라우저용 MediaPipe 엔진/모델을 web/frontend/vendor/ 에 내려받는다.
  이걸 안 하면 게임 시작 시 모델 로딩에 실패한다.

  관련 문서: rhythm_new.txt (디자인), python_to_js.txt (JS 전환 배경)
-->
<title>테스트용 미니게임 - Eye God</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/rhythm_game_theme.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap">

<div id="consent-modal" class="modal neon-modal">
  <div class="modal-box">
    <div class="neon-eyebrow">EYE GOD / RHYTHM</div>
    <h2>웹캠을 사용하여 게임을 진행하시겠습니까?</h2>
    <p>
      시선 추적과 눈 깜빡임 감지를 위해 카메라 접근 권한이 필요합니다.
      이 버전은 영상을 서버로 보내지 않고 브라우저 안에서만 처리합니다.
    </p>
    <div class="modal-actions">
      <button id="consent-cancel">취소</button>
      <button id="consent-confirm" class="primary">확인</button>
    </div>
  </div>
</div>

<div id="loading-modal" class="modal neon-modal hidden">
  <div class="modal-box">
    <div class="neon-eyebrow">LOADING</div>
    <h2 id="loading-title">준비 중입니다</h2>
    <p id="loading-detail">잠시만 기다려주세요.</p>
  </div>
</div>

<div id="play-screen" class="hidden">
  <canvas id="display"></canvas>
</div>

<div id="pause-modal" class="modal neon-modal hidden">
  <div class="modal-box">
    <div class="neon-eyebrow">PAUSED</div>
    <h2>일시정지</h2>
    <div class="modal-actions">
      <button id="resume-btn" class="primary">계속하기</button>
      <button id="restart-btn">다시 시작</button>
      <button id="quit-btn">홈으로</button>
    </div>
  </div>
</div>

<div id="result-screen" class="hidden">
  <div class="neon-eyebrow">RESULT</div>
  <h2>게임 결과</h2>
  <div class="score-card">
    <div class="label">SCORE</div>
    <div id="result-score" class="value">0</div>
  </div>
  <div class="result-stats">
    <div class="result-stat">
      <div class="label">MAX COMBO</div>
      <div id="result-combo" class="value">0</div>
    </div>
    <div class="result-stat">
      <div class="label">PERFECT</div>
      <div id="result-perfect" class="value">0</div>
    </div>
    <div class="result-stat">
      <div class="label">MISS</div>
      <div id="result-miss" class="value">0</div>
    </div>
  </div>
  <div class="actions">
    <button id="retry-btn" class="primary">다시하기</button>
    <button id="home-btn">홈으로</button>
  </div>
</div>

<script type="module" src="js/rhythm_game.js"></script>
