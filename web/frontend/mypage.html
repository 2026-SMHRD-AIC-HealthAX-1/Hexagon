<script>(function(){try{if(localStorage.getItem("eyeGodTheme")==="dark")document.documentElement.dataset.theme="dark";}catch(e){}})();</script>
<title>마이페이지 - Eye God</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/style.css">

<div class="page">
  <a class="back-link" href="index.html">← 홈으로</a>

  <header class="top-bar">
    <a class="logo" href="index.html"><span class="logo-eye"></span>Eye God</a>
  </header>

  <h1 style="font-size:22px;margin:0 0 20px">마이페이지</h1>

  <section class="health-card">
    <div class="card-head">
      <h2 class="card-title">최근 눈 건강 요약</h2>
    </div>
    <div id="health-stats" class="health-banner">
      <div class="health-banner-grid">
        <div class="health-corner health-corner-tl">
          <span class="health-corner-label">시선 추적 게임</span>
          <span class="health-corner-value" id="health-gaze-score">-</span>
        </div>
        <div class="health-corner health-corner-tr">
          <span class="health-corner-label">리듬게임</span>
          <span class="health-corner-value" id="health-rhythm-score">-</span>
        </div>

        <div id="eye-icon-wrap" class="eye-icon-wrap">
          <svg class="eye-icon" viewBox="0 0 200 150" aria-hidden="true">
            <defs>
              <clipPath id="eyeLensClipMypage">
                <path class="eye-lens-clip-shape" d="M12,75 C50,28 150,28 188,75 C150,122 50,122 12,75 Z"/>
              </clipPath>
            </defs>

            <g clip-path="url(#eyeLensClipMypage)">
              <rect class="eye-sclera" x="0" y="0" width="200" height="150"/>
              <line class="eye-grid-line" x1="0" y1="75" x2="200" y2="75"/>
              <line class="eye-grid-line" x1="100" y1="0" x2="100" y2="150"/>

              <g class="eye-icon-glow">
                <circle class="eye-iris-ring-outer" cx="100" cy="75" r="34"/>
                <circle class="eye-iris-ring-inner" cx="100" cy="75" r="24"/>
                <g class="eye-iris-ticks">
                  <line x1="100" y1="41" x2="100" y2="49"/>
                  <line x1="100" y1="41" x2="100" y2="49" transform="rotate(30 100 75)"/>
                  <line x1="100" y1="41" x2="100" y2="49" transform="rotate(60 100 75)"/>
                  <line x1="100" y1="41" x2="100" y2="49" transform="rotate(90 100 75)"/>
                  <line x1="100" y1="41" x2="100" y2="49" transform="rotate(120 100 75)"/>
                  <line x1="100" y1="41" x2="100" y2="49" transform="rotate(150 100 75)"/>
                  <line x1="100" y1="41" x2="100" y2="49" transform="rotate(180 100 75)"/>
                  <line x1="100" y1="41" x2="100" y2="49" transform="rotate(210 100 75)"/>
                  <line x1="100" y1="41" x2="100" y2="49" transform="rotate(240 100 75)"/>
                  <line x1="100" y1="41" x2="100" y2="49" transform="rotate(270 100 75)"/>
                  <line x1="100" y1="41" x2="100" y2="49" transform="rotate(300 100 75)"/>
                  <line x1="100" y1="41" x2="100" y2="49" transform="rotate(330 100 75)"/>
                </g>
                <circle class="eye-pupil" cx="100" cy="75" r="15"/>
                <circle class="eye-glint" cx="85.5" cy="60.5" r="3.5"/>
              </g>

              <rect class="eye-scan-line" x="0" y="20" width="200" height="6"/>
            </g>

            <path class="eye-lens-outline" d="M12,75 C50,28 150,28 188,75 C150,122 50,122 12,75 Z"/>
          </svg>

          <span class="eye-status-line">
            <span class="eye-status-dot"></span>
            <span class="eye-status-text" id="eye-status-text">종합 상태 · 측정 전</span>
          </span>
        </div>

        <div class="health-corner health-corner-bl">
          <span class="health-corner-label">백내장 위험도</span>
          <span class="health-corner-value" id="health-cataract-risk">-</span>
        </div>
        <div class="health-corner health-corner-br">
          <span class="health-corner-label">안구 충혈도</span>
          <span class="health-corner-value" id="health-redness">-</span>
        </div>
      </div>
    </div>
  </section>

  <section class="history-section">
    <div class="tabs tabs-primary" role="tablist">
      <button type="button" class="tab-btn active" data-category="cataract">백내장 위험도</button>
      <button type="button" class="tab-btn" data-category="redness">안구 충혈도</button>
      <button type="button" class="tab-btn" data-category="gaze">미니게임</button>
      <button type="button" class="tab-btn" data-category="rhythm">리듬게임</button>
    </div>
    <div class="tabs tabs-secondary" role="tablist">
      <button type="button" class="tab-btn active" data-view="list">누적 기록</button>
      <button type="button" class="tab-btn" data-view="trend">최근 기록 추이</button>
    </div>
    <div id="history-content" class="history-content"></div>
  </section>

  <div class="danger-links">
    <button type="button" id="delete-records-btn" class="danger-link">기록 삭제</button>
  </div>

  <section class="ranking-section">
    <h2 class="section-title ranking-title">🏆 게임 랭킹 TOP 10</h2>
    <div class="tabs tabs-ranking" role="tablist">
      <button type="button" class="tab-btn active" data-game="gaze">미니게임</button>
      <button type="button" class="tab-btn" data-game="rhythm">리듬게임</button>
    </div>
    <div id="ranking-content" class="ranking-content"></div>
  </section>

  <button id="logout-btn" class="logout-btn">로그아웃</button>

  <div class="site-footer">본 서비스는 정식 의료 서비스가 아니며 참고용이므로 정확한 진단은 전문의 또는 병원을 방문하시기 바랍니다.</div>

  <div class="quick-fab-wrap">
    <div id="quick-menu" class="quick-menu">
      <button id="quick-pick-btn" class="quick-option" type="button">📷 사진 선택</button>
      <button id="quick-capture-btn" class="quick-option" type="button">📸 사진 촬영</button>
    </div>
    <button id="quick-fab" class="quick-fab" type="button" aria-label="눈 검사 메뉴">
      <img class="quick-fab-icon" src="images/cam.png" alt="">
      <svg class="quick-fab-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" aria-hidden="true">
        <line x1="5" y1="5" x2="19" y2="19"/>
        <line x1="19" y1="5" x2="5" y2="19"/>
      </svg>
    </button>
    <input type="file" id="quick-photo-input" accept="image/*" class="hidden">
  </div>
</div>

<script type="module" src="js/mypage.js"></script>
