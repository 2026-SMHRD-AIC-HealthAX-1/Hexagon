<!--
  리듬게임 - 서버(파이썬) 계산 백업 버전.

  정식 버전(rhythm_game.html)은 브라우저에서 MediaPipe 로 직접 계산하지만,
  이 페이지는 예전 방식 그대로 카메라 프레임을 /ws/rhythm-game 으로 보내
  서버가 시선/깜빡임/판정을 계산한다. 화면은 정식 버전과 똑같은
  js/rhythm/renderer.js 를 공유하므로 보이는 건 동일하다.

  용도:
    - JS 계산 버전에 문제가 생겼을 때 되돌아갈 수 있는 대조군
    - 두 계산 방식의 체감 차이(입력 지연 등) 비교
    - ?demo=1 로 열면 로그인/웹캠/캘리브레이션 없이 디자인만 미리보기

  서버측(sessions/rhythm_game_session.py, routers/rhythm_game_ws.py)은
  그대로 남아있어 이 페이지만으로 동작한다.
-->
<title>리듬게임 (서버 계산 백업) - Eye God</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/rhythm_game_theme.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap">

<div id="consent-modal" class="modal neon-modal">
  <div class="modal-box">
    <div class="neon-eyebrow">EYE GOD / RHYTHM</div>
    <h2>웹캠을 사용하여 게임을 진행하시겠습니까?</h2>
    <p>시선 추적과 눈 깜빡임 감지를 위해 카메라 접근 권한이 필요합니다.</p>
    <div class="modal-actions">
      <button id="consent-cancel">취소</button>
      <button id="consent-confirm" class="primary">확인</button>
    </div>
  </div>
</div>

<div id="game-guide-modal" class="modal neon-modal hidden">
  <div class="modal-box">
    <div class="neon-eyebrow">GUIDE</div>
    <h2>게임 방법 안내</h2>
    <p>
      고개는 최대한 고정한 채로 진행해 주세요. 정면을 보면 가운데, 왼쪽을
      보면 왼쪽, 오른쪽을 보면 오른쪽 레인이 선택됩니다. 노트가 레인에
      내려왔을 때 눈을 깜빡여 맞춰 주세요.
    </p>
    <div class="modal-actions">
      <button id="game-guide-confirm" class="primary">확인하고 시작하기</button>
    </div>
  </div>
</div>

<div id="play-screen" class="hidden">
  <canvas id="display"></canvas>
</div>

<div id="pause-modal" class="modal neon-modal hidden">
  <div class="modal-box">
    <div class="neon-eyebrow">PAUSED</div>
    <h2>일시정지</h2>
    <div class="modal-actions">
      <button id="resume-btn" class="primary">계속하기</button>
      <button id="restart-btn">다시 시작</button>
      <button id="quit-btn">홈으로</button>
    </div>
  </div>
</div>

<div id="result-screen" class="hidden">
  <div class="neon-eyebrow">RESULT</div>
  <h2>게임 결과</h2>
  <div class="score-card">
    <div class="label">SCORE</div>
    <div id="result-score" class="value">0</div>
  </div>
  <div class="result-stats">
    <div class="result-stat">
      <div class="label">MAX COMBO</div>
      <div id="result-combo" class="value">0</div>
    </div>
    <div class="result-stat">
      <div class="label">PERFECT</div>
      <div id="result-perfect" class="value">0</div>
    </div>
    <div class="result-stat">
      <div class="label">MISS</div>
      <div id="result-miss" class="value">0</div>
    </div>
  </div>
  <div class="actions">
    <button id="retry-btn" class="primary">다시하기</button>
    <button id="home-btn">홈으로</button>
  </div>
</div>

<script type="module" src="js/rhythm_game_lab.js"></script>
